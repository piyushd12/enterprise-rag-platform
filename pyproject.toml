[project]
name = "rag-app"
version = "0.1.0"
description = "Enterprise-grade RAG application with caching, async queues, observability, and clean architecture"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "langchain-core>=1.5.5",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.5.1",
    "langgraph>=1.2.11",
    "langsmith>=0.10.17",
    "logfire[fastapi]>=4.40.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.15.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.0",
    "ragas==0.2.15",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
    "slowapi>=0.1.10",
    "streamlit>=1.62.0",
    "uvicorn[standard]>=0.52.3",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_app"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
