[project]
name = "enterprise-rag-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "bcrypt==4.0.1",
    "celery[redis]>=5.3.6",
    "boto3>=1.34.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "pillow>=10.3.0",
    "pytesseract>=0.3.10",
    "psycopg2-binary>=2.9.9",
    "fastembed>=0.8.0",
    "langchain-text-splitters>=0.3.0",
    "qdrant-client==1.9.0",
    "tiktoken>=0.7.0",
    "litellm>=1.89.1",
    "streamlit>=1.58.0",
    "rank-bm25>=0.2.2",
    "ragas>=0.4.3",
    "datasets>=5.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "aiosqlite>=0.20.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F", "I"]
