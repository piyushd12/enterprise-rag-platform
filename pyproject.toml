[project]
name = "rag-app"
version = "0.1.0"
description = "Enterprise-grade RAG application with caching, async queues, observability, and clean architecture"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langsmith>=0.10.17",
    "logfire>=4.40.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_app"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
