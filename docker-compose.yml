services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: rag-worker
    command: uv run celery -A rag_app.queue.celery_app worker --loglevel=info
    volumes:
      - ./src:/app/src
      - ./data/temp:/app/data/temp
      - ./data/eval:/app/data/eval
    # Load every setting from .env so the worker never silently drifts from
    # what the host process uses (previously only a hand-picked subset of
    # vars was passed through, so e.g. LLM_PRIMARY_MODEL updates in .env
    # were never seen by the worker -- it kept using settings.py's stale
    # hardcoded default). Only Redis/Qdrant need overriding: inside the
    # Compose network containers reach each other by service name and
    # internal port, not the host-mapped values in .env.
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - redis
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
